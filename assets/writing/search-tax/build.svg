<svg viewBox="0 0 720 452" role="img" class="motion motion-bd" aria-label="The build, in two stacked layers. The upper layer is a simulation with no model in it: prior quality, search cost and loss ratio go into exact value iteration over every belief, producing the shape of the stopping problem. The lower layer is a harness with a real model: a synthetic corpus and a coverage dial feed an agent loop running ten stopping policies, producing traces. An arrow runs downward asking whether a real model follows the shape. The upper layer is settled; the lower one is awaiting results." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="720" height="452" fill="#F2EDE1"/>
<polygon points="580,158 666,46 666,59 580,171" fill="#2F7E6D" opacity="0.20"/><polygon points="60,158 580,158 580,171 60,171" fill="#2F7E6D" opacity="0.30"/><polygon points="146,46 666,46 580,158 60,158" fill="#EDF2F0" stroke="#2F7E6D" stroke-width="1.2"/>
<text x="132" y="76" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#2F7E6D">01 · SIMULATION</text>
<text x="600" y="76" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#2F7E6D">NO MODEL · RUNS IN 15s</text>
<text x="132" y="104" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">q · c · loss ratio</text><text x="132" y="120" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">prior quality,</text><text x="132" y="133" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">cost of being wrong</text>
<line x1="283" y1="100" x2="303" y2="100" stroke="#2F7E6D" stroke-width="1.4"/><polygon points="303,96.5 310,100 303,103.5" fill="#2F7E6D"/>
<text x="322" y="104" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">value iteration</text><text x="322" y="120" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">over every belief</text><text x="322" y="133" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">the agent could hold</text>
<line x1="482" y1="100" x2="502" y2="100" stroke="#2F7E6D" stroke-width="1.4"/><polygon points="502,96.5 509,100 502,103.5" fill="#2F7E6D"/>
<text x="520" y="104" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">Figs 4–6</text><text x="520" y="120" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">the shape</text>
<text x="124" y="144" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5C6672"><tspan fill="#14263B" font-weight="600">assumes</tspan> distractors lean toward a plausible wrong answer — not noise</text>
<line x1="360" y1="181" x2="360" y2="223" stroke="#14263B" stroke-width="1.4" stroke-dasharray="4 4"/>
<polygon points="356.5,223 363.5,223 360,230" fill="#14263B"/>
<text x="372" y="208" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#14263B">does a real model follow the shape?</text>
<polygon points="580,355 666,243 666,256 580,368" fill="#B98A2F" opacity="0.20"/><polygon points="60,355 580,355 580,368 60,368" fill="#B98A2F" opacity="0.30"/><polygon points="146,243 666,243 580,355 60,355" fill="#F6F0E3" stroke="#B98A2F" stroke-width="1.2"/>
<text x="132" y="273" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#B98A2F">02 · HARNESS</text>
<text x="600" y="273" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#B98A2F">ANY CHAT ENDPOINT</text>
<text x="132" y="301" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">corpus + coverage</text><text x="132" y="317" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">the dial: 0 → 100% of</text><text x="132" y="330" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">facts handed over first</text>
<line x1="283" y1="297" x2="303" y2="297" stroke="#B98A2F" stroke-width="1.4"/><polygon points="303,293.5 310,297 303,300.5" fill="#B98A2F"/>
<text x="322" y="301" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">agent loop × 10</text><text x="322" y="317" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">ask → retrieve → stop?</text><text x="322" y="330" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">one per stopping rule</text>
<line x1="482" y1="297" x2="502" y2="297" stroke="#B98A2F" stroke-width="1.4"/><polygon points="502,293.5 509,297 502,300.5" fill="#B98A2F"/>
<text x="520" y="301" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#14263B">traces</text><text x="520" y="317" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5C6672">the receipt</text>
<text x="124" y="341" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5C6672"><tspan fill="#14263B" font-weight="600">assumes</tspan> a synthetic world — the only way to make coverage a dial</text>
<line x1="60" y1="378" x2="666" y2="378" stroke="#D8D2C4" stroke-width="1.2"/>
<circle cx="66" cy="394" r="4" fill="#2F7E6D"/>
<text x="78" y="398" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14263B">layer 1 settled — exact, reproducible</text>
<circle cx="380" cy="394" r="4" fill="#FAF7F0" stroke="#B98A2F" stroke-width="1.6"/>
<text x="392" y="398" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14263B">layer 2 built, predictions filed, results pending</text>
</svg>